y)"/><polyline points="602,236 610,236" fill="none" stroke="#4B5563" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-gray)"/><polyline points="668,256 668,280" fill="none" stroke="#4B5563" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-gray)"/><rect x="612" y="282" width="120" height="44" rx="8" fill="#FFF7E0" stroke="#F59E0B" stroke-width="2"/><text x="672.0" y="309.0" font-size="14" font-weight="700" fill="#92400E" text-anchor="middle" >물리 일관성 필터</text><rect x="490" y="282" width="112" height="44" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/><text x="546.0" y="309.0" font-size="14" font-weight="700" fill="#374151" text-anchor="middle" >착지점 예측</text><polyline points="612,304 604,304" fill="none" stroke="#4B5563" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-gray)"/><text x="372" y="299" font-size="11.5" font-weight="600" fill="#92400E" text-anchor="start" >탄도 궤적 아니면 폐기</text><text x="372" y="316" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start" >(새·비닐·와이어)</text><rect x="358" y="352" width="384" height="72" rx="10" fill="#FFFFFF" stroke="#93C5FD"/><text x="372" y="374" font-size="14" font-weight="700" fill="#1D4ED8" text-anchor="start" >위험구역 엔진</text><text x="372" y="394" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start" >인양물 투영 + 안전반경 → 동적 위험구역</text><text x="372" y="412" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start" >상하 동시작업 감지 · 강풍 시 인양 중지</text><rect x="358" y="434" width="384" height="56" rx="10" fill="#FFFFFF" stroke="#93C5FD"/><text x="372" y="456" font-size="14" font-weight="700" fill="#1D4ED8" text-anchor="start" >작업자 위치 융합</text><text x="372" y="476" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start" >영상 사람 검출 + BLE 태그 위치</text><rect x="358" y="502" width="384" height="64" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/><text x="372" y="526" font-size="14" font-weight="700" fill="#B91C1C" text-anchor="start" >