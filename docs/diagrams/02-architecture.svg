ight="62" rx="10" fill="#FFFFFF" stroke="#3B6FE0" stroke-width="2"/><text x="165.0" y="168.0" font-size="14.5" font-weight="700" fill="#1E3A8A" text-anchor="middle" >상층부 전용 카메라</text><text x="165.0" y="186.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle" >60fps · 낙하 감지</text><polyline points="290,171 338,171" fill="none" stroke="#4B5563" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-gray)"/><rect x="40" y="216" width="250" height="62" rx="10" fill="#FFFFFF" stroke="#3B6FE0" stroke-width="2"/><text x="165.0" y="244.0" font-size="14.5" font-weight="700" fill="#1E3A8A" text-anchor="middle" >기존 현장 CCTV</text><text x="165.0" y="262.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle" >RTSP 재활용 · 작업자·구역</text><polyline points="290,247 338,247" fill="none" stroke="#4B5563" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-gray)"/><rect x="40" y="292" width="250" height="62" rx="10" fill="#FFFFFF" stroke="#3B6FE0" stroke-width="2"/><text x="165.0" y="320.0" font-size="14.5" font-weight="700" fill="#1E3A8A" text-anchor="middle" >크레인 후크캠·센서</text><text x="165.0" y="338.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle" >인양물 위치·선회각</text><polyline points="290,323 338,323" fill="none" stroke="#4B5563" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-gray)"/><rect x="40" y="368" width="250" height="62" rx="10" fill="#FFFFFF" stroke="#3B6FE0" stroke-width="2"/><text x="165.0" y="396.0" font-size="14.5" font-weight="700" fill="#1E3A8A" text-anchor="middle" >스마트 안전모 BLE 태그</text><text x="165.0" y="414.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle" >작업자 위치</text><polyline points="290,399 338,399" fill="none" stroke="#4B5563" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-gray)"/><rect x="40" y="444" width="250" height="62" rx="10" fill="#FFFFFF" stroke="#3B6FE0" stroke-width="2"/><text x="165.0" y="472.0" font-size="14.5" font-weight="700" fill=