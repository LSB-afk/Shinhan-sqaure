e="#3B6FE0" stroke-width="2"/><text x="1265.0" y="500.0" font-size="14.5" font-weight="700" fill="#1E3A8A" text-anchor="middle" >현장 안전관리자</text><text x="1265.0" y="518.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle" >모바일 앱 · 조치·종결</text><rect x="1130" y="536" width="270" height="50" rx="10" fill="#FFFFFF" stroke="#3B6FE0" stroke-width="2"/><text x="1265.0" y="558.0" font-size="14.5" font-weight="700" fill="#1E3A8A" text-anchor="middle" >본사 안전팀</text><text x="1265.0" y="576.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle" >다현장 통합관제</text><rect x="1130" y="594" width="270" height="50" rx="10" fill="#FFFFFF" stroke="#3B6FE0" stroke-width="2" stroke-dasharray="6 5"/><text x="1265.0" y="616.0" font-size="14.5" font-weight="700" fill="#1E3A8A" text-anchor="middle" >(확장) 보험사·금융기관</text><text x="1265.0" y="634.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle" >위험점수 API</text><polyline points="40,707 84,707" fill="none" stroke="#4B5563" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah-gray)"/><text x="96" y="712" font-size="13.5" font-weight="400" fill="#0F172A" text-anchor="start" >센서 데이터</text><polyline points="340,707 384,707" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ah-red)"/><text x="396" y="712" font-size="13.5" font-weight="400" fill="#0F172A" text-anchor="start" >실시간 경보 (엣지 → 현장)</text><polyline points="40,747 84,747" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#ah-blue)"/><text x="96" y="752" font-size="13.5" font-weight="400" fill="#0F172A" text-anchor="start" >클라우드 동기화</text><polyline points="340,747 384,747" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#ah-green)"/><text x="396" y="752" font-size="13.5" font-weight="400" fill="#0F172A" text-anchor="start" >모델 배포 (OTA)</text><rect x="700" y="672" width="700" height="118" rx="14" fill="#0F172A"/><text x="724" y="702" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="start" >설계 원칙</text><text x="724" y="728" font-size="13.5" font-weight="400" fill="#E2E8F0" text-anchor="start" >1. 경보 판단은 엣지에서 — 통신이 끊겨도 경보는 울린다</text><text x="724" y="752" font-size="13.5" font-weight="400" fill="#E2E8F0" text-anchor="start" >2. 기존 CCTV 재활용 — 낙하 감지 구간만 전용 카메라 추가</text><text x="724" y="776" font-size="13.5" font-weight="400" fill="#E2E8F0" text-anchor="start" >3. 모든 이벤트(아차사고 포함)는 증빙·학습 데이터로 축적</text></svg>