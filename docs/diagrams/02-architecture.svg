59.5" y="176.0" font-size="14.5" font-weight="700" fill="#1E3A8A" text-anchor="middle" >드론 영상 분석</text><text x="1259.5" y="194.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle" >고소부 위험요소 리포트</text><rect x="878" y="210" width="245" height="46" rx="8" fill="#FFFFFF" stroke="#3B6FE0" stroke-width="2"/><text x="1000.5" y="230.0" font-size="14.5" font-weight="700" fill="#1E3A8A" text-anchor="middle" >관제 대시보드</text><text x="1000.5" y="248.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle" >웹 · 관리자 모바일 앱</text><rect x="1137" y="210" width="245" height="46" rx="8" fill="#FFFFFF" stroke="#3B6FE0" stroke-width="2"/><text x="1259.5" y="230.0" font-size="14.5" font-weight="700" fill="#1E3A8A" text-anchor="middle" >위험 히트맵</text><text x="1259.5" y="248.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle" >공종·협력사·시간대 위험지수</text><rect x="878" y="264" width="245" height="46" rx="8" fill="#FFFFFF" stroke="#3B6FE0" stroke-width="2"/><text x="1000.5" y="284.0" font-size="14.5" font-weight="700" fill="#1E3A8A" text-anchor="middle" >법정 증빙 자동화</text><text x="1000.5" y="302.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle" >위험성평가·점검일지</text><rect x="1137" y="264" width="245" height="46" rx="8" fill="#FFFFFF" stroke="#3B6FE0" stroke-width="2" stroke-dasharray="6 5"/><text x="1259.5" y="284.0" font-size="14.5" font-weight="700" fill="#1E3A8A" text-anchor="middle" >(확장) 금융 연계</text><text x="1259.5" y="302.0" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle" >보험·PF 위험점수 API</text><rect x="878" y="322" width="504" height="82" rx="8" fill="#FFF7E0" stroke="#F59E0B" stroke-width="2"/><text x="1130" y="352" font-size="14.5" font-weight="700" fill="#92400E" text-anchor="middle" >학습 파이프라인</text><text x="1130" y="378" font-size="12.5" font-weight="400" fill="#92400E" text-anchor="middle" >오탐·미탐 샘플 → 합성 데이터 보강 → 재학습·실측 평가 → 엣지 배포</text><text x="860" y="466" font-size="15" font-weight="800" fill="#0F1