olyline points="230,763 212,763 212,388 228,388" fill="none" stroke="#222222" stroke-width="1.3" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#kh-k)"/><text transform="rotate(-90 238 540)" x="238" y="540" font-size="12.5" font-weight="400" fill="#222222" text-anchor="middle" font-style="italic">모델 갱신</text><text x="30" y="866" font-size="16" font-weight="400" fill="#222222" text-anchor="start"><tspan font-weight="700">Fig. 5.</tspan> 3단계 운영 프로세스. 1단계(예방)는 낙하 위험요소와 인양물 하부 노출을 사전에 차단하고, 2단계(대응)는 낙하 발생 시 0.35 s 이내 경보를 목표로 하며,</text><text x="30" y="892" font-size="16" font-weight="400" fill="#222222" text-anchor="start">3단계(학습)는 모든 이벤트를 기록 · 증빙하고 오탐 · 미탐을 합성 데이터로 보강하여 검출 모델을 갱신한다. 음영 상자는 경보, 회색 상자는 기각 · 기록,</text><text x="30" y="918" font-size="16" font-weight="400" fill="#222222" text-anchor="start">마름모는 판단, 점선은 비실시간 · 확장 경로를 나타낸다. 각 단계의 <tspan font-style="italic">t</tspan>는 감지 시작부터의 누적 지연 목표치이다.</text></svg>